{% extends 'admin_base.html' %}

{% block page_title %}Products Management{% endblock %}

{% block admin_content %}
<div class="card card-premium border-0 shadow-sm">
    <div class="card-header bg-white border-0 py-3">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div class="input-group" style="max-width: 300px;">
                <span class="input-group-text bg-light border-0"><i class="fas fa-search"></i></span>
                <input type="text" class="form-control bg-light border-0" placeholder="Search products...">
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary"><i class="fas fa-filter"></i> Filter</button>
                <button class="btn btn-premium"><i class="fas fa-plus"></i> Add Product</button>
            </div>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table align-middle mb-0 table-hover">
            <thead class="bg-light">
                <tr>
                    <th class="ps-4">Product</th>
                    <th>Ref ID</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for i in range(8) %}
                <tr>
                    <td class="ps-4">
                        <div class="d-flex align-items-center gap-3">
                            <img src="https://placehold.co/50x50/png?text=P" class="rounded shadow-sm">
                            <div>
                                <h6 class="mb-0 fw-bold">Fresh Product {{i+1}}</h6>
                                <small class="text-muted">500g</small>
                            </div>
                        </div>
                    </td>
                    <td class="text-muted">#PROD-00{{i+1}}</td>
                    <td><span class="badge bg-light text-dark border">Vegetables</span></td>
                    <td class="fw-bold">$4.50</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="progress w-100" style="height: 6px; width: 60px;">
                                <div class="progress-bar bg-success" style="width: 75%"></div>
                            </div>
                            <small class="text-muted">75%</small>
                        </div>
                    </td>
                    <td>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" checked>
                        </div>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <button class="btn btn-light btn-sm rounded shadow-sm text-primary"><i
                                    class="fas fa-edit"></i></button>
                            <button class="btn btn-light btn-sm rounded shadow-sm text-danger"><i
                                    class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="card-footer bg-white border-0 py-3">
        <nav>
            <ul class="pagination justify-content-end mb-0">
                <li class="page-item disabled"><a class="page-link border-0" href="#"><i
                            class="fas fa-chevron-left"></i></a></li>
                <li class="page-item active"><a
                        class="page-link border-0 bg-purple-primary rounded-circle mx-1 text-white shadow"
                        href="#">1</a></li>
                <li class="page-item"><a class="page-link border-0 rounded-circle mx-1 text-dark" href="#">2</a></li>
                <li class="page-item"><a class="page-link border-0" href="#"><i class="fas fa-chevron-right"></i></a>
                </li>
            </ul>
        </nav>
    </div>
</div>
{% endblock %}
