{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row g-5">
        <div class="col-lg-8">
            <h4 class="mb-4 fw-bold text-purple-dark">Billing Details</h4>
            <div class="card card-premium p-4 mb-4">
                <form>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label">First name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label">Last name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="you@example.com">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" placeholder="1234 Main St" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Country</label>
                            <select class="form-select" required>
                                <option value="">Choose...</option>
                                <option>United States</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">State</label>
                            <select class="form-select" required>
                                <option value="">Choose...</option>
                                <option>California</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Zip</label>
                            <input type="text" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>

            <h4 class="mb-4 fw-bold text-purple-dark">Delivery Schedule</h4>
            <div class="card card-premium p-4 mb-4">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="delivery" id="slot1" checked>
                        <label
                            class="btn btn-outline-purple w-100 p-3 h-100 d-flex flex-column align-items-center justify-content-center gap-2"
                            for="slot1">
                            <i class="fas fa-sun fa-2x"></i>
                            <span class="fw-bold">Morning</span>
                            <small>8 AM - 11 AM</small>
                        </label>
                    </div>
                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="delivery" id="slot2">
                        <label
                            class="btn btn-outline-purple w-100 p-3 h-100 d-flex flex-column align-items-center justify-content-center gap-2"
                            for="slot2">
                            <i class="fas fa-cloud-sun fa-2x"></i>
                            <span class="fw-bold">Afternoon</span>
                            <small>1 PM - 4 PM</small>
                        </label>
                    </div>
                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="delivery" id="slot3">
                        <label
                            class="btn btn-outline-purple w-100 p-3 h-100 d-flex flex-column align-items-center justify-content-center gap-2"
                            for="slot3">
                            <i class="fas fa-moon fa-2x"></i>
                            <span class="fw-bold">Evening</span>
                            <small>5 PM - 8 PM</small>
                        </label>
                    </div>
                </div>
            </div>

            <h4 class="mb-4 fw-bold text-purple-dark">Payment</h4>
            <div class="card card-premium p-4">
                <div class="my-3">
                    <div class="form-check mb-3">
                        <input id="credit" name="paymentMethod" type="radio" class="form-check-input" checked required>
                        <label class="form-check-label fw-bold" for="credit">Credit card</label>
                    </div>
                    <div class="form-check mb-3">
                        <input id="debit" name="paymentMethod" type="radio" class="form-check-input" required>
                        <label class="form-check-label fw-bold" for="debit">Debit card</label>
                    </div>
                    <div class="form-check mb-3">
                        <input id="paypal" name="paymentMethod" type="radio" class="form-check-input" required>
                        <label class="form-check-label fw-bold" for="paypal">PayPal</label>
                    </div>
                    <div class="form-check mb-3">
                        <input id="cod" name="paymentMethod" type="radio" class="form-check-input" required>
                        <label class="form-check-label fw-bold" for="cod">Cash on Delivery</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <h4 class="d-flex justify-content-between align-items-center mb-4">
                <span class="text-purple-dark fw-bold">Your cart</span>
                <span class="badge bg-gold rounded-pill text-dark">3</span>
            </h4>
            <div class="card card-premium p-4 sticky-top" style="top: 100px;">
                <ul class="list-group list-group-flush mb-3">
                    <li class="list-group-item d-flex justify-content-between lh-sm border-0 px-0">
                        <div>
                            <h6 class="my-0">Fresh Tomato</h6>
                            <small class="text-muted">1 kg</small>
                        </div>
                        <span class="text-muted">$4.50</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between lh-sm border-0 px-0">
                        <div>
                            <h6 class="my-0">Fresh Milk</h6>
                            <small class="text-muted">2 x 1L</small>
                        </div>
                        <span class="text-muted">$4.00</span>
                    </li>
                    <li
                        class="list-group-item d-flex justify-content-between border-top border-bottom py-3 px-0 fw-bold">
                        <span>Total (USD)</span>
                        <strong class="text-purple-primary">$9.35</strong>
                    </li>
                </ul>

                <button class="btn btn-premium w-100 btn-lg rounded-pill shadow-lg" type="submit">Place Order</button>
                <div class="text-center mt-3 text-muted small">
                    <i class="fas fa-lock me-1"></i> Secure Checkout
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
