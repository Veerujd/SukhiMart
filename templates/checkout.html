{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row g-5">
        <div class="col-lg-8">
            <h4 class="mb-4 fw-bold text-dark text-uppercase letter-spacing-1 h5"
                style="border-bottom: 2px solid var(--gold-primary); display: inline-block; padding-bottom: 5px;">
                Billing Details</h4>
            <div class="card card-premium p-5 mb-5 border rounded-0">
                <form>
                    <div class="row g-4">
                        <div class="col-sm-6">
                            <label class="form-label text-muted small text-uppercase letter-spacing-1">First
                                name</label>
                            <input type="text" class="form-control rounded-0" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label text-muted small text-uppercase letter-spacing-1">Last name</label>
                            <input type="text" class="form-control rounded-0" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-muted small text-uppercase letter-spacing-1">Email</label>
                            <input type="email" class="form-control rounded-0" placeholder="you@example.com">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-muted small text-uppercase letter-spacing-1">Address</label>
                            <input type="text" class="form-control rounded-0" placeholder="1234 Main St" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label text-muted small text-uppercase letter-spacing-1">Country</label>
                            <select class="form-select rounded-0" required>
                                <option value="">Choose...</option>
                                <option>United States</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small text-uppercase letter-spacing-1">State</label>
                            <select class="form-select rounded-0" required>
                                <option value="">Choose...</option>
                                <option>California</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small text-uppercase letter-spacing-1">Zip</label>
                            <input type="text" class="form-control rounded-0" required>
                        </div>
                    </div>
                </form>
            </div>

            <h4 class="mb-4 fw-bold text-dark text-uppercase letter-spacing-1 h5"
                style="border-bottom: 2px solid var(--gold-primary); display: inline-block; padding-bottom: 5px;">
                Delivery Schedule</h4>
            <div class="card card-premium p-5 mb-5 border rounded-0">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="delivery" id="slot1" checked>
                        <label
                            class="btn btn-outline-dark w-100 p-3 h-100 d-flex flex-column align-items-center justify-content-center gap-2 rounded-0"
                            for="slot1">
                            <i class="fas fa-sun fa-2x text-gold"></i>
                            <span class="fw-bold text-uppercase small letter-spacing-1">Morning</span>
                            <small class="text-muted">8 AM - 11 AM</small>
                        </label>
                    </div>
                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="delivery" id="slot2">
                        <label
                            class="btn btn-outline-dark w-100 p-3 h-100 d-flex flex-column align-items-center justify-content-center gap-2 rounded-0"
                            for="slot2">
                            <i class="fas fa-cloud-sun fa-2x text-gold"></i>
                            <span class="fw-bold text-uppercase small letter-spacing-1">Afternoon</span>
                            <small class="text-muted">1 PM - 4 PM</small>
                        </label>
                    </div>
                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="delivery" id="slot3">
                        <label
                            class="btn btn-outline-dark w-100 p-3 h-100 d-flex flex-column align-items-center justify-content-center gap-2 rounded-0"
                            for="slot3">
                            <i class="fas fa-moon fa-2x text-gold"></i>
                            <span class="fw-bold text-uppercase small letter-spacing-1">Evening</span>
                            <small class="text-muted">5 PM - 8 PM</small>
                        </label>
                    </div>
                </div>
            </div>

            <h4 class="mb-4 fw-bold text-purple-dark">Payment</h4>
            <div class="card card-premium p-4">
                <div class="my-3">
                    <div class="form-check mb-3">
                        <input id="credit" name="paymentMethod" type="radio" class="form-check-input" checked required>
                        <label class="form-check-label fw-bold" for="credit">Credit card</label>
                    </div>
                    <div class="form-check mb-3">
                        <input id="debit" name="paymentMethod" type="radio" class="form-check-input" required>
                        <label class="form-check-label fw-bold" for="debit">Debit card</label>
                    </div>
                    <div class="form-check mb-3">
                        <input id="paypal" name="paymentMethod" type="radio" class="form-check-input" required>
                        <label class="form-check-label fw-bold" for="paypal">PayPal</label>
                    </div>
                    <div class="form-check mb-3">
                        <input id="cod" name="paymentMethod" type="radio" class="form-check-input" required>
                        <label class="form-check-label fw-bold" for="cod">Cash on Delivery</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <h4 class="d-flex justify-content-between align-items-center mb-4">
                <span class="text-dark fw-bold h5 text-uppercase letter-spacing-1"
                    style="border-bottom: 2px solid var(--gold-primary); display: inline-block; padding-bottom: 5px;">Your
                    cart</span>
                <span class="badge bg-gold rounded-0 text-dark">3</span>
            </h4>
            <div class="card card-premium p-5 sticky-top bg-dark text-white border-0 shadow-lg rounded-0"
                style="top: 100px;">
                <ul class="list-group list-group-flush mb-4 bg-transparent">
                    <li
                        class="list-group-item d-flex justify-content-between lh-sm border-0 px-0 bg-transparent text-white">
                        <div>
                            <h6 class="my-0 fw-bold">Fresh Tomato</h6>
                            <small class="text-white-50">1 kg</small>
                        </div>
                        <span class="text-white-50">$4.50</span>
                    </li>
                    <li
                        class="list-group-item d-flex justify-content-between lh-sm border-0 px-0 bg-transparent text-white">
                        <div>
                            <h6 class="my-0 fw-bold">Fresh Milk</h6>
                            <small class="text-white-50">2 x 1L</small>
                        </div>
                        <span class="text-white-50">$4.00</span>
                    </li>
                    <li
                        class="list-group-item d-flex justify-content-between border-secondary border-top border-bottom py-3 px-0 fw-bold bg-transparent text-white mt-2">
                        <span>Total (USD)</span>
                        <strong class="text-gold">$8.50</strong>
                    </li>
                </ul>

                <button class="btn btn-primary w-100 py-3 rounded-0 fw-bold text-uppercase letter-spacing-1 border-0"
                    style="background: var(--gold-primary); color: #000;" type="submit">Place Order</button>
                <div class="text-center mt-3 text-white-50 small">
                    <i class="fas fa-lock me-1"></i> Secure Checkout
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
