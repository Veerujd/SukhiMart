<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SukhiMart Admin</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background-color: var(--gray-light);
        }

        .admin-sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(180deg, var(--purple-dark) 0%, var(--purple-primary) 100%);
            color: white;
            padding-top: 20px;
            z-index: 1000;
            overflow-y: auto;
        }

        .admin-content {
            margin-left: 260px;
            padding: 30px;
        }

        .sidebar-brand {
            padding: 0 24px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 24px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--gold-primary);
            background: rgba(255, 255, 255, 0.05);
            border-right: 3px solid var(--gold-primary);
        }

        .nav-link i {
            width: 20px;
        }

        @media (max-width: 991px) {
            .admin-sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .admin-sidebar.show {
                transform: translateX(0);
            }

            .admin-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="admin-sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h4 class="mb-0 fw-bold">Sukhi<span class="text-gold">Admin</span></h4>
        </div>

        <nav class="nav flex-column mt-4">
            <a href="/admin" class="nav-link {% if request.path == '/admin' %}active{% endif %}">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="/admin/products" class="nav-link {% if 'products' in request.path %}active{% endif %}">
                <i class="fas fa-box"></i> Products
            </a>
            <a href="/admin/categories" class="nav-link {% if 'categories' in request.path %}active{% endif %}">
                <i class="fas fa-tags"></i> Categories
            </a>
            <a href="/admin/orders" class="nav-link {% if 'orders' in request.path %}active{% endif %}">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a href="/admin/customers" class="nav-link {% if 'customers' in request.path %}active{% endif %}">
                <i class="fas fa-users"></i> Customers
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-images"></i> Banners
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-percent"></i> Offers
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-cog"></i> Settings
            </a>
            <div class="mt-5 border-top border-secondary pt-3 px-3">
                <a href="/" class="btn btn-outline-light w-100 btn-sm">
                    <i class="fas fa-external-link-alt me-2"></i> Visit Store
                </a>
            </div>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="admin-content">
        <!-- Topbar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <button class="btn btn-link text-dark d-lg-none" id="sidebarToggle">
                <i class="fas fa-bars fa-lg"></i>
            </button>
            <h4 class="mb-0 fw-bold text-purple-dark">
                {% block page_title %}Dashboard{% endblock %}
            </h4>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light rounded-circle shadow-sm position-relative">
                    <i class="fas fa-bell text-muted"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </button>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark fw-bold"
                        data-bs-toggle="dropdown">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=6A1B9A&color=fff"
                            class="rounded-circle me-2" width="32" height="32">
                        Admin
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg">
                        <li><a class="dropdown-item" href="#">Profile</a></li>
                        <li><a class="dropdown-item" href="#">Settings</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-danger" href="#">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>

        {% block admin_content %}{% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sidebar Toggle for Mobile
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
